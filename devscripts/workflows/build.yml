name: Build Packages & Binaries

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade setuptools wheel build pyinstaller

      - name: Build Standalone ZipApp & Distribution
        run: |
          python bundle.py
          python -m build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pydlp-dist
          path: dist/*
